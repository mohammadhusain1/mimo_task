version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_print_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_print
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: smart_print_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/smart_print?schema=public
      JWT_SECRET: super_secret_jwt_key_for_smart_print_system_2026_min_32_chars
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
